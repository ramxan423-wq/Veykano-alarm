name: Build Veykano Debug APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
      - name: Unpack Android Studio source
        shell: bash
        run: |
          mkdir -p extracted
          unzip -q source/Mission_Alarm_Veykano_v1.12_Dil_Taramasi_Kaynak.zip -d extracted
          srcdir=$(find extracted -mindepth 1 -maxdepth 1 -type d | head -n1)
          test -n "$srcdir" || { echo "Source directory missing"; exit 1; }
          cp -a "$srcdir/." .
          chmod +x ./gradlew
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK API 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Build debug APK
        uses: gradle/actions/setup-gradle@v4
      - name: Run Gradle assembleDebug
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace
      - name: Confirm APK is present
        run: test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Mission-Alarm-Veykano-v1.12-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
